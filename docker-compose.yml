services:
  bybit-trade_script:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bybit_tp_sl
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"
    restart: always
    volumes:
      - .:/app
      - ./logs:/app_logs
    working_dir: /app
    command: sh -c "python main.py 2>&1 | tee -a /app_logs/script_logs.log"
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Moscow
    depends_on:
      postgres_db:
        condition: service_healthy

  postgres_db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - POSTGRES_DB=$POSTGRES_DB
      - TZ=Europe/Moscow
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=$PGADMIN_EMAIL
      - PGADMIN_DEFAULT_PASSWORD=$PGADMIN_PASSWORD
    env_file:
      - .env
    ports:
      - "5050:80"
    depends_on:
      - postgres_db

volumes:
  postgres_data:

