services:
  bybit-trade_script:
    build:
      context: .
      dockerfile: Dockerfile
    image: bybit_tp_sl_22_02_25
    container_name: bybit_tp_sl_22_02_25
    restart: "always"
    volumes:
      - .:/app
    working_dir: /app
    command: python main.py
    environment:
      - PYTHONUNBUFFERED=1