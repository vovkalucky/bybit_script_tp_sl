name: Deploy to VPS

on:
  push:
    branches: [ test_strategy ]


permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-tests:
    if: false # 👈 Временно отключено
    runs-on: ubuntu-latest

    env:
      BYBIT_DEMO_API_KEY: ${{ secrets.BYBIT_DEMO_API_KEY }}
      BYBIT_DEMO_SECRET_KEY: ${{ secrets.BYBIT_DEMO_SECRET_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r req.txt --no-cache-dir

#      - name: Run tests
#        run: pytest -s -v --alluredir=allure_results
#        continue-on-error: true

      - name: Run API tests with pytest and generate Allure results  # Запуск тестов
        run: |
          pytest --alluredir=allure-results
        continue-on-error: true
      - name: Upload Allure results  # Загружаем результаты тестов в GitHub Actions
        if: always()  # Загружаем файлы независимо от успеха/неуспеха тестов
        uses: actions/upload-artifact@v4
        with:
          name: allure-results  # Название артефакта
          path: allure-results  # Путь к файлам отчета
          #retention-days: 7

  publish-report:
    if: false # 👈 Временно отключено
    needs: [ run-tests ]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Allure
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.24.1/allure-2.24.1.tgz
          tar -zxvf allure-2.24.1.tgz
          sudo mv allure-2.24.1 /opt/allure
          echo "/opt/allure/bin" >> $GITHUB_PATH

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Copy history
        if: always()
        run: |
          mkdir -p allure-report/history
          if [ -d "gh-pages/history" ]; then
            cp -r gh-pages/history/* allure-report/history/
          fi

      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

  deploy:
    #needs: run-tests  # Запуск деплоя только после успешного прогона тестов
    runs-on: ubuntu-latest
    env: # 👈 Добавлено: переменная для пути к скрипту
      DEPLOY_PATH: "/home/vladimir/scripts/test_strategy"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify secrets availability
      run: |
        echo "List of secrets used in this job:"
        echo "SSH_HOST: ${{ secrets.SSH_HOST != '' && 'SET' || 'NOT SET' }}"
        echo "SSH_USER: ${{ secrets.SSH_USER != '' && 'SET' || 'NOT SET' }}"
        echo "SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' && 'SET' || 'NOT SET' }}"

    - name: Copy files to VPS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        source: "."  # Копируем весь репозиторий
        target: ${{ env.DEPLOY_PATH }}

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.1.0 #1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          cd ${{ env.DEPLOY_PATH }}
          docker compose down
          docker system prune -af
          docker compose up -d

    - name: Send Telegram Notification
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
        -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
        -d text="🛠 Деплой проекта в ${{ github.ref_name }} успешно завершен!"
