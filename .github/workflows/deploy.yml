name: Deploy to VPS

on:
  push:
    branches:
      - main  # Деплой при пуше в main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Добавление сервера в known_hosts
        run: |
          if [ -n "${{ secrets.SSH_HOST }}" ]; then
            ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || echo "Не удалось получить ключи сервера"
          else
            echo "Ошибка: SSH_HOST не задан" && exit 1
          fi

      # - name: Set up SSH
      #   run: |
      #     mkdir -p ~/.ssh
      #     echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
      #     chmod 600 ~/.ssh/id_rsa
      #     ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Настройка SSH
        run: |
          mkdir -p ~/.ssh  # Создаем папку, если она не существует
          chmod 700 ~/.ssh  # Даем ей корректные права
          if [ -n "${{ secrets.SSH_HOST }}" ]; then
            ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || echo "Не удалось получить ключи сервера"
          else
            echo "Ошибка: SSH_HOST не задан" && exit 1
          fi

      - name: Deploy via SSH
        run: |
          ssh root@${{ secrets.VPS_HOST }} << 'EOF'
          cd /scripts/bybit_tp_sl
          git pull origin main
          docker compose down
          docker compose up -d
          EOF
