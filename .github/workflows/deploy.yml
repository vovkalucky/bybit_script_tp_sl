  deploy:
    needs: test  # Запуск деплоя только после успешного прогона тестов
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify secrets availability
      run: |
        echo "List of secrets used in this job:"
        echo "SSH_HOST: ${{ secrets.SSH_HOST != '' && 'SET' || 'NOT SET' }}"
        echo "SSH_USER: ${{ secrets.SSH_USER != '' && 'SET' || 'NOT SET' }}"
        echo "SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' && 'SET' || 'NOT SET' }}"

    - name: Copy files to VPS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 46952  # Указываем порт для SSH
        source: "."  # Копируем весь репозиторий
        target: "/root/scripts/bybit_tp_sl" # Указываем папку на сервере
        exclude: "tests/**"  # Исключаем папку tests

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 46952  # Указываем порт для SSH
        script: |
          cd scripts/bybit_tp_sl
          docker compose down
          docker system prune -af
          docker compose up -d

    - name: Send Telegram Notification
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
        -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
        -d text="🛠 Деплой проекта успешно завершен!"
